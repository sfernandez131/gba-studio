# GBA Studio quality gate (see GBA_STUDIO_ROADMAP.md "quality program").
# Four ledgers per change:
#   1. editor-checks     - types + lint + full jest suite (upstream GB tests included)
#   2. gb-non-regression - the stock GB pipeline still builds a GB ROM, byte-identical
#                          to upstream's at the merge-base (the superset promise)
#   3. gba-integration   - editor CLI + gbavm engine + Wonderful Toolchain build the
#                          Lost Gem example to a .gba on a clean runner, with the
#                          Maxmod audio backend verifiably linked
#   4. gba-bundled-toolchain - the SHIPPED path (M9e): assemble a self-contained
#                          toolchain bundle, hide the system install, and build the
#                          demo from the bundle alone
name: GBA CI

on:
  pull_request:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  editor-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: "21.7.1"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn

      - name: Typecheck
        run: yarn tsc --noEmit

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

  gb-non-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: "21.7.1"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn

      - name: Fetch GBDK build tools
        run: yarn fetch-deps

      - name: Build CLI
        run: NO_TYPE_CHECKING=1 npm run make:cli

      - name: Build the stock gbs2 sample as a GB ROM
        run: |
          node out/cli/gb-studio-cli.js make:rom \
            appData/templates/gbs2/project.gbsproj out-ci/gbs2.gb

      - name: Assert GB ROM
        run: |
          ls -la out-ci/
          test -f out-ci/gbs2.gb
          size=$(stat -c%s out-ci/gbs2.gb)
          echo "GB ROM size: $size"
          test "$size" -ge 32768

      # Golden-ROM byte-parity: the fork's GB output must be byte-identical to
      # pure upstream's at the merge-base (modulo the nondeterministic
      # save_signature + header checksum - see test/golden/README.md).
      - name: Golden-ROM byte-parity vs upstream
        run: |
          python3 scripts/gb-rom-parity.py out-ci/gbs2.gb \
            test/golden/gbs2-upstream-a18666b45.gb

  gba-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: "21.7.1"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn

      # The engine and Butano are vendored as submodules under appData/engine
      # (M9b) and pinned by commit, so the `submodules: true` checkout above is
      # all that is needed. CI no longer clones a floating engine at master HEAD,
      # which means a green run is now reproducible from a gba-studio SHA alone.

      - name: Install Wonderful Toolchain (target-gba + blocksds tools)
        run: |
          sudo mkdir -p /opt/wonderful
          sudo chown "$(id -u):$(id -g)" /opt/wonderful
          curl -sL https://wonderful.asie.pl/bootstrap/wf-bootstrap-x86_64.tar.gz \
            | tar xz -C /opt/wonderful
          export WONDERFUL_TOOLCHAIN=/opt/wonderful
          export PATH=/opt/wonderful/bin:$PATH
          # First -Syu only upgrades wf-pacman itself; run twice per WT docs.
          wf-pacman -Syu --noconfirm wf-tools
          wf-pacman -Syu --noconfirm wf-tools
          wf-config repo enable blocksds
          wf-pacman -Syu --noconfirm
          wf-pacman -S --noconfirm target-gba blocksds-toolchain

      - name: Provide python for Butano's asset tools
        run: sudo apt-get -y install python-is-python3

      - name: Build CLI
        run: NO_TYPE_CHECKING=1 npm run make:cli

      - name: Build the Lost Gem example to a GBA ROM
        env:
          GBA_TOOLCHAIN: wonderful
          WONDERFUL_TOOLCHAIN: /opt/wonderful
        run: |
          export PATH=/opt/wonderful/bin:$PATH
          node out/cli/gb-studio-cli.js make:gba \
            examples/gba_demo/project.gbsproj out-ci/lost_gem.gba

      - name: Assert GBA ROM + audio backend linked
        run: |
          ls -la out-ci/
          test -f out-ci/lost_gem.gba
          size=$(stat -c%s out-ci/lost_gem.gba)
          echo "GBA ROM size: $size"
          # A healthy Lost Gem build is ~175KB; a build that silently dropped
          # the audio backend (the M5/M6 stale-cache bug class) is ~137KB.
          test "$size" -ge 150000
          # The Maxmod mixer must be in the link map (audio actually linked).
          # Since M9c the build runs in a temp tree, so the CLI drops the .map
          # and .elf beside the ROM it was asked to produce.
          grep -q "mixer_asm" out-ci/lost_gem.map

      # --- Runtime tests (quality program part 2b) -----------------------------
      # Build the parity fixture and boot it headlessly under mGBA's GDB stub;
      # gdb-multiarch asserts engine behavior (projectile launch angles, the
      # choice/menu flow, result variables). The automated form of the manual
      # GDB-stub verification recipe used for every M10/M11 slice.
      - name: Build the gba_actor_test fixture to a GBA ROM
        env:
          GBA_TOOLCHAIN: wonderful
          WONDERFUL_TOOLCHAIN: /opt/wonderful
        run: |
          export PATH=/opt/wonderful/bin:$PATH
          node out/cli/gb-studio-cli.js make:gba \
            examples/gba_actor_test/project.gbsproj out-ci/actor_test.gba

      - name: Install mGBA + gdb for the runtime tests
        # Refresh the package lists first: the runner image's cached apt metadata
        # can pin a point-release (e.g. libc6-dbg, a gdb-multiarch dep) that the
        # mirror has already superseded, giving a 404 on install. `apt-get update`
        # realigns to what the mirror currently serves.
        run: |
          sudo apt-get update
          sudo apt-get -y install mgba-sdl gdb-multiarch

      - name: Run the mGBA runtime tests
        run: |
          bash scripts/gba-runtime-test.sh \
            out-ci/actor_test.gba out-ci/actor_test.elf

  # --- The shipped path (M9e) ---------------------------------------------
  # Everything above builds with a system Wonderful Toolchain, which is how this
  # was developed but NOT how a user's machine will look. This job proves the
  # thing we actually intend to ship: a self-contained bundle, used with no
  # toolchain installed.
  #
  # It is also the first time three pieces run anywhere other than the author's
  # Windows box - assembleGbaToolchain.ts, findGbaToolchain's bundled branch,
  # and makeGbaBuild's bundled+unix branch - which is the point. Nothing is
  # published here: the bundle is assembled from the runner's own install.
  gba-bundled-toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: "21.7.1"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn

      - name: Install Wonderful Toolchain (the bundle's source material)
        run: |
          sudo mkdir -p /opt/wonderful
          sudo chown "$(id -u):$(id -g)" /opt/wonderful
          curl -sL https://wonderful.asie.pl/bootstrap/wf-bootstrap-x86_64.tar.gz \
            | tar xz -C /opt/wonderful
          export WONDERFUL_TOOLCHAIN=/opt/wonderful
          export PATH=/opt/wonderful/bin:$PATH
          # First -Syu only upgrades wf-pacman itself; run twice per WT docs.
          wf-pacman -Syu --noconfirm wf-tools
          wf-pacman -Syu --noconfirm wf-tools
          wf-config repo enable blocksds
          wf-pacman -Syu --noconfirm
          wf-pacman -S --noconfirm target-gba blocksds-toolchain

      - name: Provide python for Butano's asset tools
        run: sudo apt-get -y install python-is-python3

      - name: Assemble a toolchain bundle
        run: |
          npx ts-node src/scripts/assembleGbaToolchain.ts --source=/opt/wonderful
          test -d buildTools/linux-x64/gba-toolchain/target/gba
          test -s buildTools/linux-x64/gba-toolchain/MANIFEST.txt
          # The GPL components make licence texts mandatory, and the assembler
          # refuses to emit a bundle without them - assert it anyway.
          test -n "$(ls -A buildTools/linux-x64/gba-toolchain/licenses)"
          du -sh buildTools/linux-x64/gba-toolchain

      - name: Build CLI
        run: NO_TYPE_CHECKING=1 npm run make:cli

      # The decisive step. With /opt/wonderful moved aside, anything that still
      # reaches for a system install fails here rather than on a user's machine.
      # This is what caught the wf-* tools' hardcoded `#!/opt/wonderful/bin/wf-lua`
      # shebang on Windows, where a bundle build had looked green while silently
      # using the system interpreter.
      - name: Hide the system toolchain
        run: sudo mv /opt/wonderful /opt/wonderful.hidden

      - name: Build the Lost Gem example from the bundle alone
        env:
          GBA_TOOLCHAIN: bundled
        run: |
          node out/cli/gb-studio-cli.js make:gba \
            examples/gba_demo/project.gbsproj out-ci/lost_gem_bundled.gba

      - name: Assert the ROM
        run: |
          ls -la out-ci/
          size=$(stat -c%s out-ci/lost_gem_bundled.gba)
          echo "GBA ROM size: $size"
          test "$size" -ge 150000
          grep -q "mixer_asm" out-ci/lost_gem_bundled.map
